name: Release

# Push a tag like `v0.1.0` (it must match the version in package.json) to build the installers for
# macOS, Windows and Linux and publish them as a GitHub release.
# "Run workflow" from the Actions tab does a dry run: it builds everything and keeps the files as
# workflow artifacts, but publishes nothing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: macOS, os: macos-latest, args: '--mac --arm64 --x64' }
          - { name: Windows, os: windows-latest, args: '--win --x64' }
          - { name: Linux, os: ubuntu-latest, args: '--linux --x64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json ($version)"
            exit 1
          fi

      - run: npm ci
      - run: npm test

      - name: Build installers
        run: npm run dist -- ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: release-*
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            notes=$(mktemp)
            echo "Release ${GITHUB_REF_NAME}" > "$notes"
          fi
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "OOXML Toolkit ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes" \
            --verify-tag \
            --latest
