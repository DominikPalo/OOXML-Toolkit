appId: dev.ooxml-toolkit.app
productName: OOXML Toolkit
copyright: Copyright © 2026 Dominik Paľo
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
fileAssociations:
  - { ext: docx, name: Word document, role: Editor }
  - { ext: docm, name: Word macro-enabled document, role: Editor }
  - { ext: dotx, name: Word template, role: Editor }
  - { ext: xlsx, name: Excel workbook, role: Editor }
  - { ext: xlsm, name: Excel macro-enabled workbook, role: Editor }
  - { ext: xltx, name: Excel template, role: Editor }
  - { ext: pptx, name: PowerPoint presentation, role: Editor }
  - { ext: pptm, name: PowerPoint macro-enabled presentation, role: Editor }
  - { ext: potx, name: PowerPoint template, role: Editor }
  - { ext: ppsx, name: PowerPoint slide show, role: Editor }
  - { ext: vsdx, name: Visio drawing, role: Viewer }
  - { ext: odt, name: OpenDocument text, role: Viewer }
  - { ext: ods, name: OpenDocument spreadsheet, role: Viewer }
  - { ext: odp, name: OpenDocument presentation, role: Viewer }
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # No Developer ID certificate yet, so the app is signed *ad hoc* ("-"). That gives it a valid code
  # signature (an unsigned/re-packaged Electron app is reported as "damaged" on Apple Silicon once a
  # browser has quarantined the download) but it is NOT notarized: users still confirm the first
  # launch once (see the release notes).
  # To sign and notarize properly, replace `identity: "-"` with a Developer ID, enable
  # `hardenedRuntime`, set `notarize: true`, and provide the usual CSC_* / APPLE_* variables.
  identity: "-"
  hardenedRuntime: false
dmg:
  artifactName: OOXML-Toolkit-${version}-mac-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: OOXML-Toolkit-${version}-win-${arch}-setup.${ext}
portable:
  artifactName: OOXML-Toolkit-${version}-win-${arch}-portable.${ext}
linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]
  # Add `deb` / `rpm` here once a maintainer e-mail is set in package.json ("author").
appImage:
  artifactName: OOXML-Toolkit-${version}-linux-${arch}.${ext}
